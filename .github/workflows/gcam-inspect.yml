name: Patch GCam (disable direct gyro channel)

on:
  workflow_dispatch:
    inputs:
      apk_name:
        description: "GCam APK file name in the release (the new one that restarts the phone)"
        required: true
        default: "GCam.apk"
      release_tag:
        description: "Release tag where the APK was uploaded"
        required: true
        default: "gcam"
      apktool_version:
        description: "apktool version"
        default: "2.9.3"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      APK: ${{ inputs.apk_name }}
      TAG: ${{ inputs.release_tag }}
    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre-headless zip unzip
          wget -q "https://github.com/iBotPeaches/apktool/releases/download/v${{ inputs.apktool_version }}/apktool_${{ inputs.apktool_version }}.jar" -O apktool.jar

      - name: Download APK from release
        run: |
          gh release download "$TAG" --repo "${{ github.repository }}" \
            --pattern "$APK" --dir . --clobber
          ls -lh "$APK"

      # -r keeps resources.arsc untouched, smali is still decoded
      - name: Decompile
        run: java -jar apktool.jar d -r -f "$APK" -o out

      - name: Patch smali
        run: |
          python3 - <<'PY'
          import subprocess, sys

          def find(name):
              r = subprocess.run(["find", "out", "-name", name],
                                 capture_output=True, text=True).stdout.split()
              if len(r) != 1:
                  sys.exit(f"PATCH FAILED: expected exactly one {name}, found {r}")
              return r[0]

          def patch(path, old, new):
              s = open(path, encoding="utf-8").read()
              n = s.count(old)
              if n != 1:
                  sys.exit(f"PATCH FAILED: {path}: expected 1 match, found {n}")
              open(path, "w", encoding="utf-8").write(s.replace(old, new))
              print("patched", path)

          # 1) Provider of the hardware-buffer direct gyro: force "not available",
          #    so GCam falls back to its normal gyro listener (like the old version).
          patch(
              find("jhe.smali"),
              "    iget-boolean v1, v1, Llzh;->d:Z\n\n    if-eqz v1, :cond_2\n",
              "    const/4 v1, 0x0\n\n    if-eqz v1, :cond_2\n",
          )

          # 2) Safety net: never call SensorManager.createDirectChannel.
          #    The code already handles a null result ("Creating direct channel returned null").
          patch(
              find("lww.smali"),
              "    invoke-virtual {v4, v0}, Landroid/hardware/SensorManager;->createDirectChannel(Landroid/hardware/HardwareBuffer;)Landroid/hardware/SensorDirectChannel;\n\n    move-result-object v2\n",
              "    const/4 v2, 0x0\n",
          )
          PY

      - name: Rebuild
        run: |
          java -jar apktool.jar b out -o unsigned.apk
          ls -lh unsigned.apk

      # Keep the same signing key between runs so updates install over each other
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: gcam.jks
          key: gcam-signing-key-v1

      - name: Align and sign
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          if [ ! -f gcam.jks ]; then
            keytool -genkeypair -keystore gcam.jks -storepass android -keypass android \
              -alias key -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=gcam-patch"
          fi
          $BT/zipalign -p -f 4 unsigned.apk aligned.apk
          $BT/apksigner sign --ks gcam.jks --ks-pass pass:android --key-pass pass:android \
            --out "GCam-patched.apk" aligned.apk
          $BT/apksigner verify -v GCam-patched.apk | head -5
          ls -lh GCam-patched.apk

      - name: Upload to release
        run: |
          gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "${{ github.repository }}" \
              --title "$TAG" --notes "GCam files"
          gh release upload "$TAG" GCam-patched.apk --repo "${{ github.repository }}" --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: GCam-patched
          path: GCam-patched.apk
