name: Patch GCam (direct gyro fix + default Full / JPEG)

on:
  workflow_dispatch:
    inputs:
      apk_link:
        description: "GCam APK link - paste here (the ORIGINAL new GCam). Leave empty to use the release below"
        required: false
        default: ""
      apk_name:
        description: "Only if no link: GCam APK file name in the release"
        required: false
        default: "GCam.apk"
      release_tag:
        description: "Release tag: the patched APK is uploaded here (and the APK is read from here if no link)"
        required: true
        default: "gcam"
      patch_prefs:
        description: "Also make Hardware level = Full and Viewfinder format = JPEG the defaults (main + front)"
        type: boolean
        default: true
      app_name:
        description: "App name shown on the launcher (empty = keep the original name)"
        required: false
        default: "Camera"
      icon_link:
        description: "App icon link - paste here (square PNG, 512px or more, transparent background is best). Empty = keep the original icon"
        required: false
        default: ""
      icon_background:
        description: "Icon background colour for a transparent logo (hex)"
        required: false
        default: "#FFFFFF"
      apktool_version:
        description: "apktool version"
        default: "2.9.3"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      APK_LINK: ${{ inputs.apk_link }}
      APK: ${{ inputs.apk_name }}
      TAG: ${{ inputs.release_tag }}
      PATCH_PREFS: ${{ inputs.patch_prefs }}
      APP_NAME: ${{ inputs.app_name }}
      ICON_LINK: ${{ inputs.icon_link }}
      ICON_BG: ${{ inputs.icon_background }}
    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre-headless zip unzip aria2
          python3 -m pip install --break-system-packages gdown pillow
          wget -q "https://github.com/iBotPeaches/apktool/releases/download/v${{ inputs.apktool_version }}/apktool_${{ inputs.apktool_version }}.jar" -O apktool.jar

      - name: Get the APK (link or release)
        run: |
          set -euo pipefail
          if [ -n "$APK_LINK" ]; then
            echo "Downloading from the pasted link"
            if echo "$APK_LINK" | grep -q "drive.google.com"; then
              gdown --fuzzy "$APK_LINK" -O input.apk
            else
              aria2c -x16 -s16 -k1M --file-allocation=none -d . -o input.apk "$APK_LINK"
            fi
          else
            echo "No link given, using the release asset"
            gh release download "$TAG" --repo "${{ github.repository }}" \
              --pattern "$APK" --dir . --clobber
            mv -f "$APK" input.apk
          fi
          ls -lh input.apk
          # an expired or wrong link often returns an HTML page instead of the APK
          unzip -tq input.apk >/dev/null || { echo "The downloaded file is not a valid APK. Check the link."; exit 1; }

      - name: Get the icon (link)
        if: ${{ inputs.icon_link != '' }}
        run: |
          set -euo pipefail
          if echo "$ICON_LINK" | grep -q "drive.google.com"; then
            gdown --fuzzy "$ICON_LINK" -O icon_dl
          else
            aria2c -x16 -s16 -k1M --file-allocation=none -d . -o icon_dl "$ICON_LINK"
          fi
          python3 - <<'PY'
          from PIL import Image
          try:
              im = Image.open("icon_dl").convert("RGBA")
          except Exception:
              raise SystemExit("The icon link is not a valid image (PNG/JPG/WEBP). Check the link.")
          print("icon:", im.size)
          if min(im.size) < 192:
              print("WARNING: the icon is small, 512px or more looks better")
          im.save("icon_src.png")
          PY

      # With patch_prefs (or a new name/icon) the resources are decoded too (the settings live in res/xml).
      # Without it, -r keeps resources.arsc untouched (safer rebuild).
      - name: Decompile
        run: |
          if [ "$PATCH_PREFS" = "true" ] || [ -n "$APP_NAME" ] || [ -n "$ICON_LINK" ]; then
            java -jar apktool.jar d -f input.apk -o out
          else
            java -jar apktool.jar d -r -f input.apk -o out
          fi

      - name: Patch
        run: |
          python3 - <<'PY'
          import os, re, subprocess, sys

          def find(name):
              r = subprocess.run(["find", "out", "-name", name],
                                 capture_output=True, text=True).stdout.split()
              if len(r) != 1:
                  sys.exit(f"PATCH FAILED: expected exactly one {name}, found {r}")
              return r[0]

          def patch(path, old, new):
              s = open(path, encoding="utf-8").read()
              n = s.count(old)
              if n != 1:
                  sys.exit(f"PATCH FAILED: {path}: expected 1 match, found {n}")
              open(path, "w", encoding="utf-8").write(s.replace(old, new))
              print("patched", path)

          # 1) Direct gyro provider: force "not available" (fixes the phone restart)
          patch(
              find("jhe.smali"),
              "    iget-boolean v1, v1, Llzh;->d:Z\n\n    if-eqz v1, :cond_2\n",
              "    const/4 v1, 0x0\n\n    if-eqz v1, :cond_2\n",
          )

          # 2) Safety net: never call SensorManager.createDirectChannel
          patch(
              find("lww.smali"),
              "    invoke-virtual {v4, v0}, Landroid/hardware/SensorManager;->createDirectChannel(Landroid/hardware/HardwareBuffer;)Landroid/hardware/SensorDirectChannel;\n\n    move-result-object v2\n",
              "    const/4 v2, 0x0\n",
          )

          # 3) Defaults: Hardware level = FULL (-1), Viewfinder format = JPEG (-1)
          #    value 0 = automatic, -1 = FULL / JPEG, 1 = LEVEL 3 / YUV
          if os.environ.get("PATCH_PREFS") == "true":
              xml = "out/res/xml/camera_preferences.xml"
              s = open(xml, encoding="utf-8").read()
              for key in ("pref_c2a_key", "pref_c2a_key_front",
                          "pref_img_key", "pref_img_key_front"):
                  pat = re.compile(r'(<ListPreference\b[^>]*?android:key="%s"[^>]*?)android:defaultValue="0"' % key)
                  s, n = pat.subn(r'\1android:defaultValue="-1"', s)
                  if n != 1:
                      sys.exit(f"PATCH FAILED: {key}: expected 1 match, found {n}")
                  print("default set to -1:", key)
              open(xml, "w", encoding="utf-8").write(s)
          PY

      - name: Rebrand (app name + icon)
        if: ${{ inputs.app_name != '' || inputs.icon_link != '' }}
        run: |
          python3 - <<'PY'
          import glob, os, re, sys
          import xml.etree.ElementTree as ET
          from PIL import Image

          NAME = os.environ.get("APP_NAME", "").strip()
          ICON = "icon_src.png" if os.path.exists("icon_src.png") else None
          BG_INPUT = os.environ.get("ICON_BG", "#FFFFFF").strip() or "#FFFFFF"
          ANDROID = "http://schemas.android.com/apk/res/android"
          A = "{%s}" % ANDROID
          report = []

          def log(msg):
              print(msg)
              report.append(msg)

          man_path = "out/AndroidManifest.xml"
          man_text = open(man_path, encoding="utf-8").read()
          for prefix, uri in re.findall(r'xmlns:([\w-]+)="([^"]+)"', man_text):
              ET.register_namespace(prefix, uri)
          tree = ET.parse(man_path)
          root = tree.getroot()
          app = root.find("application")
          if app is None:
              sys.exit("REBRAND FAILED: no <application> in AndroidManifest.xml")

          def is_launcher(c):
              for f in c.findall("intent-filter"):
                  acts = [a.get(A + "name") for a in f.findall("action")]
                  cats = [x.get(A + "name") for x in f.findall("category")]
                  if "android.intent.action.MAIN" in acts and "android.intent.category.LAUNCHER" in cats:
                      return True
              return False

          launchers = [c for c in list(app.findall("activity")) + list(app.findall("activity-alias")) if is_launcher(c)]
          log("launcher entries: %s" % [c.get(A + "name") for c in launchers])
          if not launchers:
              log("WARNING: no launcher activity found, nothing changed")
              open("rebrand_report.txt", "w").write("\n".join(report))
              sys.exit(0)

          manifest_changed = False

          # ---------- app name ----------
          def set_string(name, value):
              esc = value.replace("&", "&amp;").replace("<", "&lt;").replace("'", "\\'")
              pat = re.compile(r'(<string\b[^>]*\bname="%s"[^>]*>)(.*?)(</string>)' % re.escape(name), re.S)
              n_total = 0
              for f in glob.glob("out/res/values*/*.xml"):
                  s = open(f, encoding="utf-8").read()
                  s2, n = pat.subn(lambda m: m.group(1) + esc + m.group(3), s)
                  if n:
                      open(f, "w", encoding="utf-8").write(s2)
                      n_total += n
              return n_total

          if NAME:
              done = set()
              for c in launchers:
                  label = c.get(A + "label") or app.get(A + "label")
                  if label and label.startswith("@string/"):
                      sname = label.split("/", 1)[1]
                      if sname in done:
                          continue
                      n = set_string(sname, NAME)
                      done.add(sname)
                      log("app name: string '%s' set to '%s' in %d place(s)" % (sname, NAME, n))
                      if n == 0:
                          log("WARNING: string '%s' not found in res/values*/" % sname)
                  else:
                      c.set(A + "label", NAME)
                      if app.get(A + "label") and not app.get(A + "label").startswith("@string/"):
                          app.set(A + "label", NAME)
                      manifest_changed = True
                      log("app name: literal label on %s set to '%s'" % (c.get(A + "name"), NAME))
          else:
              log("app name: unchanged (empty input)")

          # ---------- icon ----------
          def res_files(kind, name):
              out = []
              for d in sorted(glob.glob("out/res/%s*" % kind)):
                  for ext in ("png", "webp", "jpg", "xml"):
                      p = "%s/%s.%s" % (d, name, ext)
                      if os.path.exists(p):
                          out.append(p)
              if not out:
                  # the file name can differ from the resource name: use adaptive icon files that start with the name
                  for p in sorted(glob.glob("out/res/%s*/%s*.xml" % (kind, name))):
                      if "<adaptive-icon" in open(p, encoding="utf-8").read(2000):
                          out.append(p)
                  if not out:
                      log("files with '%s' in the name: %s" % (name, sorted(glob.glob("out/res/*/*%s*" % name))[:30]))
              return out

          def fit(img, size, scale, bg=None):
              W, H = size
              canvas = Image.new("RGBA", (W, H), bg if bg else (0, 0, 0, 0))
              s = int(min(W, H) * scale)
              im = img.copy()
              im.thumbnail((s, s), Image.LANCZOS)
              canvas.paste(im, ((W - im.width) // 2, (H - im.height) // 2), im)
              return canvas

          def parse_color(h):
              h = h.lstrip("#")
              if len(h) == 3:
                  h = "".join(c * 2 for c in h)
              return (int(h[0:2], 16), int(h[2:4], 16), int(h[4:6], 16), 255)

          ADAPTIVE_XML = ('<?xml version="1.0" encoding="utf-8"?>\n'
                          '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
                          '    <background android:drawable="@drawable/gcam_icon_bg"/>\n'
                          '    <foreground android:drawable="@drawable/gcam_icon_fg"/>\n'
                          '</adaptive-icon>\n')

          if ICON:
              icon = Image.open(ICON).convert("RGBA")
              opaque = icon.getchannel("A").getextrema()[0] == 255
              bg = icon.getpixel((2, 2)) if opaque else parse_color(BG_INPUT)
              log("icon source %dx%d, %s -> adaptive background %s" % (icon.width, icon.height,
                  "opaque" if opaque else "transparent", "#%02x%02x%02x" % bg[:3]))

              refs = set()
              for el in [app] + launchers:
                  for attr in ("icon", "roundIcon"):
                      v = el.get(A + attr)
                      if v and re.match(r"@(mipmap|drawable)/", v):
                          refs.add(v)
              log("icon references: %s" % sorted(refs))

              adaptive_written = False
              for ref in sorted(refs):
                  kind, name = ref[1:].split("/", 1)
                  files = res_files(kind, name)
                  if not files:
                      log("WARNING: no files found for %s" % ref)
                  for p in files:
                      ext = p.rsplit(".", 1)[1]
                      if ext == "xml":
                          head = open(p, encoding="utf-8").read(2000)
                          if "<adaptive-icon" in head:
                              open(p, "w", encoding="utf-8").write(ADAPTIVE_XML)
                              adaptive_written = True
                              log("adaptive icon rewritten: %s" % p)
                          else:
                              log("WARNING: %s is not an adaptive icon, skipped" % p)
                      else:
                          size = Image.open(p).size
                          new = fit(icon, size, 1.0)
                          if ext == "jpg":
                              new = new.convert("RGB")
                              new.save(p, "JPEG", quality=95)
                          else:
                              new.save(p, "WEBP" if ext == "webp" else "PNG")
                          log("raster icon replaced: %s (%dx%d)" % (p, size[0], size[1]))

              if adaptive_written:
                  os.makedirs("out/res/drawable-nodpi", exist_ok=True)
                  fit(icon, (432, 432), 0.66).save("out/res/drawable-nodpi/gcam_icon_fg.png")
                  Image.new("RGBA", (432, 432), bg).save("out/res/drawable-nodpi/gcam_icon_bg.png")
                  log("added out/res/drawable-nodpi/gcam_icon_fg.png and gcam_icon_bg.png")
          else:
              log("icon: unchanged (no icon link given)")

          if manifest_changed:
              tree.write(man_path, encoding="utf-8", xml_declaration=True)
              log("manifest rewritten")

          open("rebrand_report.txt", "w").write("\n".join(report))
          PY

      - name: Default LMC config (OnePlus7TPro.xml)
        run: |
          # optional: put OnePlus7TPro.xml in the repo root (of the branch you run); it becomes the first-start default settings of the app
          gh api -H "Accept: application/vnd.github.raw" "repos/${{ github.repository }}/contents/OnePlus7TPro.xml?ref=$GITHUB_REF_NAME" > OnePlus7TPro.xml 2>/dev/null || rm -f OnePlus7TPro.xml
          python3 - <<'PY'
          import os, re, sys, glob, shutil
          import xml.etree.ElementTree as ET

          CFG = "OnePlus7TPro.xml"
          if not os.path.exists(CFG):
              print("No OnePlus7TPro.xml in the repo root, default config skipped")
              sys.exit(0)

          ANDROID = "http://schemas.android.com/apk/res/android"
          A = "{%s}" % ANDROID

          # the config must be a valid SharedPreferences export: <map> ... </map>
          try:
              cfg = ET.parse(CFG).getroot()
          except Exception as e:
              sys.exit("SEED FAILED: OnePlus7TPro.xml is not valid XML: %s" % e)
          if cfg.tag != "map":
              sys.exit("SEED FAILED: OnePlus7TPro.xml must start with <map> (an LMC settings export)")
          print("config entries:", len(list(cfg)))

          man_path = "out/AndroidManifest.xml"
          raw = open(man_path, "rb").read()
          if not raw.lstrip().startswith(b"<"):
              sys.exit("SEED FAILED: AndroidManifest.xml was not decoded (keep app_name, icon_link or patch_prefs set so apktool decodes resources)")
          for prefix, uri in re.findall(r'xmlns:([\w-]+)="([^"]+)"', raw.decode("utf-8")):
              ET.register_namespace(prefix, uri)
          tree = ET.parse(man_path)
          root = tree.getroot()
          app = root.find("application")
          pkg = root.get("package") or ""
          if app is None:
              sys.exit("SEED FAILED: no <application> in AndroidManifest.xml")

          smali_dirs = sorted(glob.glob("out/smali*"))
          if not smali_dirs:
              sys.exit("SEED FAILED: no smali folder found")

          # 1) the config goes into the APK as an asset
          os.makedirs("out/assets", exist_ok=True)
          shutil.copyfile(CFG, "out/assets/default_config.xml")

          # 2) helper class: on the FIRST start only (no settings file yet) copy the asset to shared_prefs/<package>_preferences.xml
          HELPER = r'''.class public Lpatch/SeedPrefs;
          .super Ljava/lang/Object;

          .method public static run(Landroid/content/Context;)V
              .locals 9

              :try_start_0
              invoke-virtual {p0}, Landroid/content/Context;->getApplicationInfo()Landroid/content/pm/ApplicationInfo;

              move-result-object v0

              iget-object v0, v0, Landroid/content/pm/ApplicationInfo;->dataDir:Ljava/lang/String;

              new-instance v1, Ljava/io/File;

              const-string v2, "default_config_applied"

              invoke-direct {v1, v0, v2}, Ljava/io/File;-><init>(Ljava/lang/String;Ljava/lang/String;)V

              invoke-virtual {v1}, Ljava/io/File;->exists()Z

              move-result v2

              if-nez v2, :done

              new-instance v2, Ljava/io/File;

              const-string v3, "shared_prefs"

              invoke-direct {v2, v0, v3}, Ljava/io/File;-><init>(Ljava/lang/String;Ljava/lang/String;)V

              invoke-virtual {v2}, Ljava/io/File;->mkdirs()Z

              new-instance v3, Ljava/lang/StringBuilder;

              invoke-direct {v3}, Ljava/lang/StringBuilder;-><init>()V

              invoke-virtual {p0}, Landroid/content/Context;->getPackageName()Ljava/lang/String;

              move-result-object v4

              invoke-virtual {v3, v4}, Ljava/lang/StringBuilder;->append(Ljava/lang/String;)Ljava/lang/StringBuilder;

              const-string v4, "_preferences.xml"

              invoke-virtual {v3, v4}, Ljava/lang/StringBuilder;->append(Ljava/lang/String;)Ljava/lang/StringBuilder;

              invoke-virtual {v3}, Ljava/lang/StringBuilder;->toString()Ljava/lang/String;

              move-result-object v3

              new-instance v4, Ljava/io/File;

              invoke-direct {v4, v2, v3}, Ljava/io/File;-><init>(Ljava/io/File;Ljava/lang/String;)V

              invoke-virtual {v1}, Ljava/io/File;->createNewFile()Z

              invoke-virtual {v4}, Ljava/io/File;->exists()Z

              move-result v5

              if-nez v5, :done

              invoke-virtual {p0}, Landroid/content/Context;->getAssets()Landroid/content/res/AssetManager;

              move-result-object v5

              const-string v6, "default_config.xml"

              invoke-virtual {v5, v6}, Landroid/content/res/AssetManager;->open(Ljava/lang/String;)Ljava/io/InputStream;

              move-result-object v5

              new-instance v6, Ljava/io/FileOutputStream;

              invoke-direct {v6, v4}, Ljava/io/FileOutputStream;-><init>(Ljava/io/File;)V

              const/16 v7, 0x2000

              new-array v7, v7, [B

              :loop
              invoke-virtual {v5, v7}, Ljava/io/InputStream;->read([B)I

              move-result v8

              if-ltz v8, :copied

              const/4 v0, 0x0

              invoke-virtual {v6, v7, v0, v8}, Ljava/io/OutputStream;->write([BII)V

              goto :loop

              :copied
              invoke-virtual {v6}, Ljava/io/OutputStream;->close()V

              invoke-virtual {v5}, Ljava/io/InputStream;->close()V

              :done
              return-void
              :try_end_0
              .catch Ljava/lang/Throwable; {:try_start_0 .. :try_end_0} :catch_0

              :catch_0
              move-exception v0

              return-void
          .end method
          '''
          os.makedirs(os.path.join(smali_dirs[0], "patch"), exist_ok=True)
          open(os.path.join(smali_dirs[0], "patch", "SeedPrefs.smali"), "w", encoding="utf-8").write(HELPER)

          # 3) call the helper at the very start of Application.attachBaseContext (before anything reads the settings)
          CALL = "    invoke-static {p1}, Lpatch/SeedPrefs;->run(Landroid/content/Context;)V\n\n"
          name = app.get(A + "name")
          if name:
              if name.startswith("."):
                  name = pkg + name
              elif "." not in name:
                  name = pkg + "." + name
              path = None
              for d in smali_dirs:
                  p = os.path.join(d, name.replace(".", "/") + ".smali")
                  if os.path.exists(p):
                      path = p
                      break
              if path is None:
                  sys.exit("SEED FAILED: smali file of the Application class %s not found" % name)
              s = open(path, encoding="utf-8").read()
              m = re.search(r"^\.method [^\n]*attachBaseContext\(Landroid/content/Context;\)V\n(?:    \.(?:locals|registers) \d+\n)", s, re.M)
              if m:
                  s = s[:m.end()] + "\n" + CALL.rstrip("\n") + "\n" + s[m.end():]
                  print("hooked existing attachBaseContext in", path)
              else:
                  sup = re.search(r"^\.super (L[^;]+;)", s, re.M).group(1)
                  add = ("\n.method protected attachBaseContext(Landroid/content/Context;)V\n    .locals 0\n\n" + CALL +
                         "    invoke-super {p0, p1}, %s->attachBaseContext(Landroid/content/Context;)V\n\n    return-void\n.end method\n" % sup)
                  s = s.rstrip("\n") + "\n" + add
                  print("added attachBaseContext to", path)
              open(path, "w", encoding="utf-8").write(s)
          else:
              # no custom Application class: add a tiny one and register it
              smali = (".class public Lpatch/SeedApplication;\n.super Landroid/app/Application;\n\n"
                       ".method public constructor <init>()V\n    .locals 0\n\n    invoke-direct {p0}, Landroid/app/Application;-><init>()V\n\n    return-void\n.end method\n\n"
                       ".method protected attachBaseContext(Landroid/content/Context;)V\n    .locals 0\n\n" + CALL +
                       "    invoke-super {p0, p1}, Landroid/app/Application;->attachBaseContext(Landroid/content/Context;)V\n\n    return-void\n.end method\n")
              open(os.path.join(smali_dirs[0], "patch", "SeedApplication.smali"), "w", encoding="utf-8").write(smali)
              app.set(A + "name", "patch.SeedApplication")
              tree.write(man_path, encoding="utf-8", xml_declaration=True)
              print("no Application class, added patch.SeedApplication")
          print("default config will be copied to shared_prefs/<package>_preferences.xml on the first start")
          PY

      - name: Bake lib patches into the APK (no runtime patcher)
        run: |
          python3 - <<'PY'
          import os, re, sys, glob
          import xml.etree.ElementTree as ET

          CFG = "OnePlus7TPro.xml"
          if not os.path.exists(CFG):
              print("No OnePlus7TPro.xml in the repo root, nothing baked in")
              sys.exit(0)

          def skip(msg):
              print("BAKE SKIPPED (the app keeps its normal runtime patcher): " + msg)
              sys.exit(0)

          # ---- settings (same file the app reads: SharedPreferences) ----
          try:
              prefs = {e.get("name"): (e.text or "") for e in ET.parse(CFG).getroot() if e.tag == "string"}
          except Exception as e:
              skip("%s is not valid XML: %s" % (CFG, e))

          # ---- the app's patcher class ----
          hits = [p for p in glob.glob("out/smali*/com/SDE/LibPatcher.smali")]
          if len(hits) != 1:
              skip("com/SDE/LibPatcher.smali not found (this GCam has no LMC lib patcher)")
          smali_path = hits[0]
          src = open(smali_path, encoding="utf-8").read()
          lib_path = "out/lib/arm64-v8a/libgcastartup.so"
          if not os.path.exists(lib_path):
              skip("%s not found" % lib_path)

          offs = {m.group(1): int(m.group(2), 16)
                  for m in re.finditer(r"^\.field [\w ]*static final (_\w+):I = (0x[0-9a-fA-F]+)\s*$", src, re.M)}
          m = re.search(r"^\.method private static copyLib\(Lcom/SDE/LibPatcher;\)Z\n(.*?)^\.end method", src, re.S | re.M)
          if not m or not offs:
              skip("copyLib() or the offsets were not found in LibPatcher.smali")

          # ---- lens suffix: the lib is patched for the lens that is selected at start (back main = no suffix) ----
          def aux():
              try:
                  return int(prefs.get("pref_aux_key", "0") or 0)
              except ValueError:
                  return 0
          SUFFIX = {0: "", 1: "_2", 2: "_3", 3: "_4", 4: "_5"}

          def get_string(k):
              return prefs.get(k, "0")

          writes = []
          def set_hex(off, hexs):
              if len(hexs) >= 2:
                  if len(hexs) % 2:
                      hexs = hexs[:-1]
                  writes.append((off, bytes.fromhex(hexs)))

          # ---- tiny interpreter for the straight-line + simple-branch smali of copyLib() ----
          lines = []
          for l in m.group(1).split("\n"):
              l = l.strip()
              if l and not l.startswith("#") and not l.startswith("."):
                  lines.append(l)
          labels = {l: i for i, l in enumerate(lines) if l.startswith(":")}
          reg = {}
          res = None
          i = 0
          steps = 0
          try:
              while i < len(lines):
                  steps += 1
                  if steps > 200000:
                      raise RuntimeError("too many steps")
                  l = lines[i]; i += 1
                  if l.startswith(":"):
                      continue
                  mm = re.match(r'const-string(?:/jumbo)? (\w+), "(.*)"$', l)
                  if mm: reg[mm.group(1)] = mm.group(2); continue
                  mm = re.match(r"const(?:/4|/16|/high16)? (\w+), (-?0x[0-9a-fA-F]+)$", l)
                  if mm: reg[mm.group(1)] = int(mm.group(2), 16); continue
                  mm = re.match(r"sget (\w+), Lcom/SDE/LibPatcher;->(\w+):I$", l)
                  if mm: reg[mm.group(1)] = offs[mm.group(2)]; continue
                  mm = re.match(r"invoke-static \{(\w+)\}, (L[^;]+;)->(\w+)\(", l)
                  if mm:
                      a = reg[mm.group(1)]; c, f = mm.group(2), mm.group(3)
                      if c == "Lcom/SDE/LensValue;" and f == "SetLensValue": res = a + SUFFIX.get(aux(), "")
                      elif f == "getIntValue": res = int(get_string(a))
                      elif f == "getHexIntValue": res = int(get_string(a), 16)
                      elif c == "Lcom/Fix/Pref;" and f == "MenuValue":
                          v = prefs.get(a, "")
                          res = int(v) if v != "" else 0
                      else: raise RuntimeError("unknown call " + l)
                      continue
                  mm = re.match(r"invoke-virtual \{p0, (\w+), (\w+)\}, Lcom/SDE/LibPatcher;->(setValueHex|setValueHexToo)\(", l)
                  if mm:
                      off, arg = reg[mm.group(1)], reg[mm.group(2)]
                      set_hex(off, get_string(arg) if mm.group(3) == "setValueHex" else arg)
                      continue
                  mm = re.match(r"invoke-virtual \{p0\}, Lcom/SDE/LibPatcher;->(setToneCurve|setGammaCurve)\(\)V$", l)
                  if mm: raise RuntimeError("%s is enabled in the config (not supported by the baker)" % mm.group(1))
                  if l.startswith("invoke-virtual {p0}, Lcom/SDE/LibPatcher;->getAppContext"):
                      break                       # the rest only loads the patched lib
                  mm = re.match(r"move-result(?:-object)? (\w+)$", l)
                  if mm: reg[mm.group(1)] = res; continue
                  mm = re.match(r"if-(eqz|nez) (\w+), (:\w+)$", l)
                  if mm:
                      z = (reg[mm.group(2)] == 0)
                      if (mm.group(1) == "eqz") == z: i = labels[mm.group(3)] + 1
                      continue
                  mm = re.match(r"goto (:\w+)$", l)
                  if mm: i = labels[mm.group(1)] + 1; continue
                  raise RuntimeError("unknown instruction: " + l)
          except Exception as e:
              skip("could not read the patcher logic (%s)" % e)

          size = os.path.getsize(lib_path)
          bad = [(o, len(b)) for o, b in writes if o + len(b) > size]
          if bad:
              skip("offsets outside the library (%s): a different GCam build?" % bad[:3])

          # ---- apply the same writes to the library inside the APK ----
          changed = 0
          with open(lib_path, "r+b") as f:
              for o, b in writes:
                  f.seek(o)
                  old = f.read(len(b))
                  if old != b: changed += len(b)
                  f.seek(o); f.write(b)
          print("patcher writes: %d, bytes changed in libgcastartup.so: %d" % (len(writes), changed))

          # ---- the app must load that library directly (no runtime patcher) ----
          meth = re.search(r"^\.method public static loadLibX\(Ljava/lang/String;\)V\n.*?^\.end method", src, re.S | re.M)
          if not meth:
              skip("loadLibX() not found")
          new = (".method public static loadLibX(Ljava/lang/String;)V\n    .locals 0\n\n"
                 "    invoke-static {p0}, Ljava/lang/System;->loadLibrary(Ljava/lang/String;)V\n\n    return-void\n.end method")
          open(smali_path, "w", encoding="utf-8").write(src[:meth.start()] + new + src[meth.end():])
          print("loadLibX now loads the baked library directly; the runtime patcher is bypassed")
          PY

      # Diagnostic only: where the code reads these settings, in case the XML
      # default alone is not enough on some build.
      - name: Record where the settings are read
        run: |
          grep -rnE '"pref_(c2a|img)_key(_[0-9]|_front)?"' out/smali* > key_reads.txt || true
          wc -l key_reads.txt
          head -20 key_reads.txt | cut -c1-200

      - name: Rebuild
        run: |
          java -jar apktool.jar b out -o unsigned.apk
          ls -lh unsigned.apk

      # Keep the same signing key between runs so updates install over each other
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: gcam.jks
          key: gcam-signing-key-v1

      - name: Align and sign
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          if [ ! -f gcam.jks ]; then
            keytool -genkeypair -keystore gcam.jks -storepass android -keypass android \
              -alias key -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=gcam-patch"
          fi
          $BT/zipalign -p -f 4 unsigned.apk aligned.apk
          $BT/apksigner sign --ks gcam.jks --ks-pass pass:android --key-pass pass:android \
            --out "GCam-patched.apk" aligned.apk
          $BT/apksigner verify -v GCam-patched.apk | head -5
          ls -lh GCam-patched.apk

      - name: Upload to release
        run: |
          gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "${{ github.repository }}" \
              --title "$TAG" --notes "GCam files"
          gh release upload "$TAG" GCam-patched.apk --repo "${{ github.repository }}" --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: GCam-patched
          path: |
            GCam-patched.apk
            key_reads.txt
            rebrand_report.txt
