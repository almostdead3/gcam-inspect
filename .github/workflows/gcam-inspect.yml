name: Inspect GCam settings (hardware level / viewfinder format)

on:
  workflow_dispatch:
    inputs:
      apk_name:
        description: "GCam APK file name in the release (the ORIGINAL new GCam, not the patched one)"
        required: true
        default: "GCam.apk"
      release_tag:
        description: "Release tag where the APK was uploaded"
        required: true
        default: "gcam"
      apktool_version:
        description: "apktool version"
        default: "2.9.3"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      APK: ${{ inputs.apk_name }}
      TAG: ${{ inputs.release_tag }}
    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre-headless zip unzip
          wget -q "https://github.com/iBotPeaches/apktool/releases/download/v${{ inputs.apktool_version }}/apktool_${{ inputs.apktool_version }}.jar" -O apktool.jar

      - name: Download APK from release
        run: |
          gh release download "$TAG" --repo "${{ github.repository }}" \
            --pattern "$APK" --dir . --clobber
          ls -lh "$APK"

      # Full decode (resources + smali): the settings screen lives in res/xml
      - name: Decompile
        run: java -jar apktool.jar d -f "$APK" -o outfull

      - name: Find the two settings
        run: |
          mkdir -p inspect
          python3 - <<'PY'
          import glob, json, os, re, shutil, subprocess
          import xml.etree.ElementTree as ET

          out = "outfull"
          pat = re.compile(r"hardware\s*level|view\s*finder|viewfinder", re.I)

          def strip(attrs):
              return {k.split("}")[-1]: v for k, v in attrs.items()}

          # 1) string resources whose text mentions the settings
          names = {}
          for f in glob.glob(f"{out}/res/values*/strings.xml"):
              try:
                  root = ET.parse(f).getroot()
              except Exception:
                  continue
              for s in root.iter("string"):
                  text = "".join(s.itertext())
                  if s.get("name") and pat.search(text):
                      names.setdefault(s.get("name"), []).append({"file": f, "text": text})

          # 2) preference elements that use those strings as their title
          matches, keep = [], set()
          for f in glob.glob(f"{out}/res/xml*/*.xml"):
              try:
                  root = ET.parse(f).getroot()
              except Exception:
                  continue
              for el in root.iter():
                  a = strip(el.attrib)
                  title = a.get("title", "")
                  if title.startswith("@string/") and title.split("/")[1] in names:
                      matches.append({"file": f, "tag": el.tag, "attrs": a})
                      keep.add(f)

          # 3) smali that mentions each preference key
          keys = sorted({m["attrs"].get("key") for m in matches if m["attrs"].get("key")})
          smali_hits = {}
          for k in keys:
              r = subprocess.run(["grep", "-rnF", f'"{k}"'] + glob.glob(f"{out}/smali*"),
                                 capture_output=True, text=True).stdout.splitlines()
              smali_hits[k] = r[:40]

          # 4) fallback: key-looking strings in smali, in case the screen is not XML
          fb = subprocess.run(
              ["grep", "-rniEo", r'"[a-z_]*(hardware_?level|viewfinder|view_finder|vf_format)[a-z_]*"']
              + glob.glob(f"{out}/smali*"), capture_output=True, text=True).stdout.splitlines()

          json.dump({"string_names": names, "pref_matches": matches,
                     "smali_hits": smali_hits, "fallback_smali_strings": fb[:200]},
                    open("inspect/settings_matches.json", "w"), indent=2)

          # 5) copy the XML files and the arrays they use
          for f in keep:
              d = os.path.join("inspect", os.path.dirname(f))
              os.makedirs(d, exist_ok=True)
              shutil.copy(f, d)
          for f in glob.glob(f"{out}/res/values*/arrays.xml"):
              d = os.path.join("inspect", os.path.dirname(f))
              os.makedirs(d, exist_ok=True)
              shutil.copy(f, d)

          print("string names:", list(names))
          print("preference matches:", len(matches))
          print("keys:", keys)
          print("fallback smali strings:", len(fb))
          PY
          du -sh inspect

      - name: Zip and upload
        run: |
          zip -r gcam_prefs_inspect.zip inspect
          ls -lh gcam_prefs_inspect.zip
          gh release view inspect-data --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create inspect-data --repo "${{ github.repository }}" \
              --title "inspect-data" --notes "Auto-generated inspect files"
          gh release upload inspect-data gcam_prefs_inspect.zip --repo "${{ github.repository }}" --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: gcam_prefs_inspect
          path: gcam_prefs_inspect.zip
